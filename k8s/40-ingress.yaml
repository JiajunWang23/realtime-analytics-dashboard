# ingress-nginx: /api and /ws go straight to the backend Service (WebSocket upgrade is
# handled natively; timeouts raised for long-lived sockets), everything else to the SPA.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analytics
  namespace: analytics
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: analytics.local
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: backend, port: { number: 5000 } } } }
          - { path: /ws,  pathType: Prefix, backend: { service: { name: backend, port: { number: 5000 } } } }
          - { path: /rta.js, pathType: Exact, backend: { service: { name: backend, port: { number: 5000 } } } }
          - { path: /,    pathType: Prefix, backend: { service: { name: frontend, port: { number: 80 } } } }
