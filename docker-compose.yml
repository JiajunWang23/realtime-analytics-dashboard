services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: analytics }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxclients", "10000"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/analytics
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: "2"
      COLLECT_ORIGINS: https://uiucwangjiajun.com,https://www.uiucwangjiajun.com,http://localhost:8080
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy: { replicas: 2 }      # two backends -> proves cross-instance fan-out via Redis pub/sub

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]

  # Live Wikimedia EventStreams -> /api/events (source=wikipedia), ~30 events/s.
  wikipedia:
    build: ./connectors
    command: ["--api", "http://backend:5000"]
    depends_on: [backend]
    restart: unless-stopped

  simulator:
    image: python:3.12-slim
    command: ["sh", "-c", "pip install -q aiohttp && python /scripts/simulate.py --url http://backend:5000 --rate 5 --batch 5"]
    volumes: [./scripts:/scripts:ro]
    depends_on: [backend]
    profiles: [demo]

volumes:
  pgdata:
