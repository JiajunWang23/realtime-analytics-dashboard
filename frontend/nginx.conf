# Serves the SPA and reverse-proxies the API + WebSocket so the browser sees one origin.
upstream api { server backend:5000; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ { proxy_pass http://api; proxy_set_header Host $host; }

  location /ws {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;   # long-lived sockets; server pings every 20s
    proxy_send_timeout 3600s;
  }

  location / { try_files $uri /index.html; }
}
